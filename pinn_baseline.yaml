experiment_name: "pinn_baseline_burgers"
seed: 42

pde:
  type: "burgers"
  viscosity: 0.003183098861837907  # 0.01/pi
  domain_x: [-1.0, 1.0]
  domain_t: [0.0, 1.0]
  n_collocation: 10000
  n_boundary: 200
  n_initial: 200

model:
  type: "pinn"
  hidden_layers: [64, 64, 64, 64]
  activation: "tanh"

training:
  optimizer: "adam"
  learning_rate: 0.001
  epochs: 5000
  loss_weights:
    pde: 1.0
    boundary: 10.0
    initial: 10.0
  checkpoint_every: 1000
  log_every: 100

evaluation:
  n_test_points: 10000
  ood_shift: 0.1
  n_stability_runs: 3
